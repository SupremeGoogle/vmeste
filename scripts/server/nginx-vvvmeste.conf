# «Вместе» на vvvmeste.com: сайт (Next :3010) и хранилище фото (Garage :3900).
# Старый адрес sslip.io переадресуется сюда (sites-available/vmeste).
server {
    server_name vvvmeste.com www.vvvmeste.com;
    # Сжатие: скрипты и стили сжаты заранее при выкладке (.gz рядом, gzip_static),
    # остальное — на лету. Без него JS уходил бы целиком: ~3× дольше на телефоне.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml font/ttf application/vnd.ms-fontobject;
    if ($host = www.vvvmeste.com) { return 301 https://vvvmeste.com$request_uri; }

    # Защита от перегрузки: см. conf.d/vmeste-limits.conf.
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn vm_conn 200;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;
    error_page 429 /_busy.html;
    error_page 502 504 /_down.html;
    error_page 503 /_busy.html;
    location = /_busy.html { root /var/www/vmeste-errors; internal; add_header Retry-After 20 always; add_header Cache-Control "no-store" always; }
    location = /_down.html { root /var/www/vmeste-errors; internal; add_header Cache-Control "no-store" always; }
    client_body_timeout 30s;
    server_tokens off;
    # Импорт гостей из Excel, обложки организатора; фото гостей идут в s3.*
    client_max_body_size 12m;

    # Картинки шаблонов и сборка — с диска, мимо Node: у сервера одно ядро.
    location /_next/static/ {
        alias /var/www/vmeste/current/.next/static/;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location /media/ {
        alias /var/www/vmeste/current/public/media/;
        gzip_static on;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Публичное приглашение зависит только от адреса (без cookie) и само
    # отдаёт «public, max-age=60, stale-while-revalidate=86400»: nginx держит
    # его минуту, а если сайт упал — отдаёт последнюю версию ещё сутки.
    # Личные страницы (/i/slug/token, ?name=) приходят с no-store и не кешируются.
    # Главная для гостей без входа одинаковая — nginx держит её 5 минут
    # готовой. С cookie сессии (вошли в кабинет) — всегда свежая от Node.
    # Ответы с Set-Cookie nginx не кеширует сам.
    location = / {
        limit_req zone=vm_ip burst=150 nodelay;
        proxy_cache vmeste;
        proxy_cache_key "$scheme$host$request_uri|$http_rsc|$http_next_router_prefetch";
        proxy_cache_bypass $cookie_vmeste_session;
        proxy_no_cache $cookie_vmeste_session;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Образцы шаблонов не зависят от посетителя и сами отдают public, max-age=300.
    location ^~ /templates/ {
        limit_req zone=vm_ip burst=150 nodelay;
        proxy_cache vmeste;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/i/[^/]+$ {
        limit_req zone=vm_ip burst=150 nodelay;
        proxy_cache vmeste;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=vm_ip burst=150 nodelay;
        limit_req zone=vm_post burst=40 nodelay;
        limit_req zone=vm_node burst=500;
        proxy_connect_timeout 5s;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # ZIP альбома идёт потоком — не буферизовать и не обрывать.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/vvvmeste.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vvvmeste.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    server_name s3.vvvmeste.com;
    limit_conn vm_conn 30;
    limit_req_status 429;
    client_header_timeout 15s;
    client_body_timeout 120s;
    server_tokens off;
    # Исходник с телефона: 48-Мп HEIC бывает до 40 МБ.
    client_max_body_size 45m;

    location / {
        limit_req zone=vm_ip burst=150 nodelay;
        proxy_pass http://127.0.0.1:3900;
        # Подпись ссылки включает Host — передаём его как есть.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/vvvmeste.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vvvmeste.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.vvvmeste.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = vvvmeste.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name vvvmeste.com www.vvvmeste.com;

    listen 80;
    return 404; # managed by Certbot




}

server {
    if ($host = s3.vvvmeste.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name s3.vvvmeste.com;

    listen 80;
    return 404; # managed by Certbot


}