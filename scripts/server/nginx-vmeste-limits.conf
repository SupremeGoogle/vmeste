# «Вместе»: лимиты запросов (используются только в sites-enabled/vmeste).
# На площадке сотня гостей сидит за одним Wi-Fi = один адрес, поэтому
# лимиты по адресу щедрые: они против скриптов, а не против гостей.
limit_req_zone $binary_remote_addr zone=vm_ip:10m rate=30r/s;
# Запросы, которые доходят до Node, — общий поток на весь сайт. Сверх него
# запросы ждут в очереди (burst), а не роняют процесс.
limit_req_zone $server_name zone=vm_node:1m rate=45r/s;
map $request_method $vm_post_key { POST $binary_remote_addr; default ""; }
limit_req_zone $vm_post_key zone=vm_post:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=vm_conn:10m;
