# «Вместе»: сайт (Next на 127.0.0.1:3010) и хранилище фото (Garage на :3900).
server {
    server_name vmeste.186-246-27-151.sslip.io;
    # Сайт переехал на vvvmeste.com — старые ссылки (QR, приглашения) ведут туда же.
    return 301 https://vvvmeste.com$request_uri;

    # Защита от перегрузки: см. conf.d/vmeste-limits.conf.
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn vm_conn 200;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;
    error_page 429 /_busy.html;
    error_page 502 504 /_down.html;
    error_page 503 /_busy.html;
    location = /_busy.html { root /var/www/vmeste-errors; internal; add_header Retry-After 20 always; add_header Cache-Control "no-store" always; }
    location = /_down.html { root /var/www/vmeste-errors; internal; add_header Cache-Control "no-store" always; }
    client_body_timeout 30s;
    server_tokens off;
    # Импорт гостей из Excel, обложки организатора; фото гостей идут в s3.*
    client_max_body_size 12m;

    # Картинки шаблонов и сборка — с диска, мимо Node: у сервера одно ядро.
    location /_next/static/ {
        alias /var/www/vmeste/current/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location /media/ {
        alias /var/www/vmeste/current/public/media/;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Публичное приглашение зависит только от адреса (без cookie) и само
    # отдаёт «public, max-age=60, stale-while-revalidate=86400»: nginx держит
    # его минуту, а если сайт упал — отдаёт последнюю версию ещё сутки.
    # Личные страницы (/i/slug/token, ?name=) приходят с no-store и не кешируются.
    location ~ ^/i/[^/]+$ {
        limit_req zone=vm_ip burst=150 nodelay;
        proxy_cache vmeste;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=vm_ip burst=150 nodelay;
        limit_req zone=vm_post burst=40 nodelay;
        limit_req zone=vm_node burst=500;
        proxy_connect_timeout 5s;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # ZIP альбома идёт потоком — не буферизовать и не обрывать.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vmeste.186-246-27-151.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vmeste.186-246-27-151.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name s3.vmeste.186-246-27-151.sslip.io;
    limit_conn vm_conn 30;
    limit_req_status 429;
    client_header_timeout 15s;
    client_body_timeout 120s;
    server_tokens off;
    # Исходник с телефона: 48-Мп HEIC бывает до 40 МБ.
    client_max_body_size 45m;

    location / {
        limit_req zone=vm_ip burst=150 nodelay;
        proxy_pass http://127.0.0.1:3900;
        # Подпись ссылки включает Host — передаём его как есть.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vmeste.186-246-27-151.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vmeste.186-246-27-151.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = vmeste.186-246-27-151.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name vmeste.186-246-27-151.sslip.io;
    listen 80;
    return 404; # managed by Certbot


}

server {
    if ($host = s3.vmeste.186-246-27-151.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name s3.vmeste.186-246-27-151.sslip.io;
    listen 80;
    return 404; # managed by Certbot


}