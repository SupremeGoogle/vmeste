# Паритет с продом. На машине разработчика Docker может отсутствовать —
# тогда используется локальный PostgreSQL, см. README.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: vmeste
      POSTGRES_PASSWORD: vmeste
      POSTGRES_DB: vmeste_dev
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmeste -d vmeste_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Хранилище фото, нужно с этапа 5
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data

volumes:
  db_data:
  storage_data:
